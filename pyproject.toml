[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-ledger"
version = "0.1.0"
description = "Track AI token grants, capacity contracts, and burn rate across providers"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Serena Key", email = "serena@unispark.dev" }]
requires-python = ">=3.11"
keywords = ["openai", "anthropic", "tokens", "ai", "cli", "grants", "capacity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
token-ledger = "token_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["token_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
